<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#0369a1" />
    </linearGradient>
    <linearGradient id="metal1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>
    <linearGradient id="gold1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow1" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg1)" />
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Grid / Arc Background Accent -->
  <path d="M 20 50 A 30 30 0 0 1 80 50" fill="none" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" stroke-dasharray="3,3" />
  <circle cx="50" cy="50" r="18" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" />

  <!-- Thước Eke (Set Square Triangle) -->
  <g filter="url(#shadow1)">
    <polygon points="26,76 74,76 26,28" fill="rgba(255,255,255,0.92)" />
    <!-- Inner cut-out triangle -->
    <polygon points="34,70 62,70 34,42" fill="#0284c7" opacity="0.9" />
    <!-- Ruler Marks -->
    <line x1="38" y1="76" x2="38" y2="72" stroke="#64748b" stroke-width="1" />
    <line x1="44" y1="76" x2="44" y2="71" stroke="#64748b" stroke-width="1.5" />
    <line x1="50" y1="76" x2="50" y2="72" stroke="#64748b" stroke-width="1" />
    <line x1="56" y1="76" x2="56" y2="71" stroke="#64748b" stroke-width="1.5" />
    <line x1="62" y1="76" x2="62" y2="72" stroke="#64748b" stroke-width="1" />
  </g>

  <!-- Compa (Compass) -->
  <g filter="url(#shadow1)">
    <!-- Top Joint / Handle -->
    <rect x="47.5" y="16" width="5" height="10" rx="2" fill="url(#gold1)" />
    <circle cx="50" cy="27" r="4.5" fill="url(#metal1)" stroke="#d97706" stroke-width="1.5" />

    <!-- Left Leg (with Needle) -->
    <path d="M 48 27 L 33 65" stroke="url(#metal1)" stroke-width="3.5" stroke-linecap="round" />
    <polygon points="33,65 31,73 35,70" fill="#f8fafc" />

    <!-- Right Leg (with Pencil tip) -->
    <path d="M 52 27 L 67 65" stroke="url(#metal1)" stroke-width="3.5" stroke-linecap="round" />
    <rect x="64" y="60" width="6" height="8" rx="1.5" transform="rotate(30 67 64)" fill="url(#gold1)" />
    <polygon points="68,69 72,76 66,74" fill="#0f172a" />
  </g>
</svg>
