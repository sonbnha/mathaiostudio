<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#065f46" />
    </linearGradient>
    <linearGradient id="gold3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <linearGradient id="bookCover" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>
    <filter id="shadow3" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg3)" />
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Subtle math formula background elements -->
  <text x="24" y="28" fill="rgba(255,255,255,0.2)" font-size="9" font-family="serif" font-style="italic">f(x)</text>
  <text x="68" y="32" fill="rgba(255,255,255,0.2)" font-size="10" font-family="serif">∫dx</text>
  <text x="22" y="80" fill="rgba(255,255,255,0.2)" font-size="10" font-family="serif">∞</text>
  <text x="68" y="78" fill="rgba(255,255,255,0.2)" font-size="9" font-family="serif">x²</text>

  <g filter="url(#shadow3)">
    <!-- Open Book Base -->
    <path d="M 22 58 Q 50 63 50 78 Q 50 63 78 58 L 78 72 Q 50 77 50 86 Q 50 77 22 72 Z" fill="url(#bookCover)" stroke="#cbd5e1" stroke-width="0.8" />
    <path d="M 50 63 L 50 86" stroke="#059669" stroke-width="1.5" />
    <line x1="28" y1="64" x2="44" y2="66" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="28" y1="68" x2="42" y2="70" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="56" y1="66" x2="72" y2="64" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />
    <line x1="58" y1="70" x2="72" y2="68" stroke="#94a3b8" stroke-width="1" stroke-linecap="round" />

    <!-- Glasses (Kính Tri Thức) -->
    <!-- Left Lens Rim -->
    <circle cx="36" cy="42" r="12" fill="rgba(255,255,255,0.25)" stroke="url(#gold3)" stroke-width="3" />
    <!-- Left Lens Reflection -->
    <path d="M 30 36 Q 36 33 40 37" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />
    
    <!-- Right Lens Rim -->
    <circle cx="64" cy="42" r="12" fill="rgba(255,255,255,0.25)" stroke="url(#gold3)" stroke-width="3" />
    <!-- Right Lens Reflection -->
    <path d="M 58 36 Q 64 33 68 37" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-linecap="round" />

    <!-- Bridge -->
    <path d="M 47 41 Q 50 37 53 41" fill="none" stroke="url(#gold3)" stroke-width="3" stroke-linecap="round" />

    <!-- Left/Right Temple Ends -->
    <path d="M 24 41 L 18 39" stroke="url(#gold3)" stroke-width="2.5" stroke-linecap="round" />
    <path d="M 76 41 L 82 39" stroke="url(#gold3)" stroke-width="2.5" stroke-linecap="round" />
  </g>
</svg>
