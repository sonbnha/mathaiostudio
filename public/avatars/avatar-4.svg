<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" />
      <stop offset="100%" stop-color="#b45309" />
    </linearGradient>
    <linearGradient id="symbolGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#fef3c7" />
    </linearGradient>
    <filter id="shadow4" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="3.5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg4)" />
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.3)" stroke-width="1.5" />

  <!-- Geometric / Math Accents -->
  <circle cx="50" cy="50" r="38" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="1.2" stroke-dasharray="4,4" />
  <circle cx="50" cy="50" r="28" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="1" />

  <g filter="url(#shadow4)">
    <!-- Sigma Symbol (Σ) -->
    <path
      d="M 22 28 L 52 28 L 52 34 L 36 34 L 47 50 L 34 66 L 54 66 L 54 72 L 22 72 L 22 67 L 37 50 L 22 33 Z"
      fill="url(#symbolGrad)"
      stroke="rgba(180,83,9,0.4)"
      stroke-width="0.8"
    />

    <!-- Pi Symbol (π) - Stylized Next to Sigma -->
    <!-- Top horizontal bar -->
    <path
      d="M 58 38 C 58 36 60 35 63 35 L 82 35 C 84 35 85 36 86 38 C 85 40 83 40 81 40 L 62 40 C 60 40 58 39 58 38 Z"
      fill="#ffffff"
    />
    <!-- Left Leg -->
    <path
      d="M 64 39 L 63 68 C 63 71 61 72 59 72 L 58 69 C 60 69 61 68 61 66 L 62 39 Z"
      fill="#ffffff"
    />
    <!-- Right Leg (with hook) -->
    <path
      d="M 77 39 L 77 66 C 77 69 78 71 81 71 C 83 71 84 70 85 69 L 86 71 C 84 73 81 74 78 73 C 75 72 74 69 74 66 L 74 39 Z"
      fill="#ffffff"
    />

    <!-- Small Math Sparkle -->
    <polygon points="76,24 78,28 82,30 78,32 76,36 74,32 70,30 74,28" fill="#ffffff" />
  </g>
</svg>
