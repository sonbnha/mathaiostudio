<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg5" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="100%" stop-color="#9f1239" />
    </linearGradient>
    <linearGradient id="sphereGrad" x1="25%" y1="20%" x2="85%" y2="85%">
      <stop offset="0%" stop-color="#fda4af" />
      <stop offset="35%" stop-color="#f43f5e" />
      <stop offset="80%" stop-color="#be123c" />
      <stop offset="100%" stop-color="#881337" />
    </linearGradient>
    <filter id="shadow5" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="4" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg5)" />
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Outer Celestial Coordinates -->
  <circle cx="50" cy="50" r="41" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="1" stroke-dasharray="2,4" />

  <g filter="url(#shadow5)">
    <!-- 3D Mathematical Sphere -->
    <circle cx="50" cy="50" r="26" fill="url(#sphereGrad)" />

    <!-- Equator Ellipse (Front) -->
    <ellipse cx="50" cy="50" rx="26" ry="9" fill="none" stroke="#ffffff" stroke-width="1.5" stroke-dasharray="80 80" stroke-dashoffset="0" opacity="0.8" />
    
    <!-- Meridian Ellipses (Longitudinal lines) -->
    <ellipse cx="50" cy="50" rx="13" ry="26" fill="none" stroke="#ffffff" stroke-width="1.2" opacity="0.6" />
    
    <!-- Central Axis (Z-axis) -->
    <line x1="50" y1="20" x2="50" y2="80" stroke="#fecdd3" stroke-width="1.2" stroke-dasharray="2,2" opacity="0.7" />

    <!-- Orbital Ring / Geodesic Path -->
    <ellipse cx="50" cy="50" rx="34" ry="14" transform="rotate(-32 50 50)" fill="none" stroke="#ffffff" stroke-width="2" opacity="0.85" />
    
    <!-- Satellite / Orbital Point -->
    <circle cx="24" cy="34" r="3.5" fill="#ffffff" />
    <circle cx="76" cy="66" r="2.5" fill="#fecdd3" />

    <!-- Specular Highlight on Sphere -->
    <circle cx="41" cy="41" r="5" fill="#ffffff" opacity="0.6" />
    <circle cx="39" cy="39" r="2" fill="#ffffff" opacity="0.9" />
  </g>
</svg>
