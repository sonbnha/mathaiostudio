<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="bg6" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9333ea" />
      <stop offset="100%" stop-color="#581c87" />
    </linearGradient>
    <linearGradient id="aiFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f3e8ff" />
    </linearGradient>
    <linearGradient id="cyanSpark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="shadow6" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="3.5" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="50" cy="50" r="48" fill="url(#bg6)" />
  <circle cx="50" cy="50" r="47" fill="none" stroke="rgba(255,255,255,0.25)" stroke-width="1.5" />

  <!-- Neural / Digital Network Lines in Background -->
  <line x1="22" y1="30" x2="35" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <line x1="78" y1="30" x2="65" y2="40" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <line x1="30" y1="72" x2="40" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <line x1="70" y1="72" x2="60" y2="60" stroke="rgba(255,255,255,0.15)" stroke-width="1" />
  <circle cx="22" cy="30" r="2" fill="rgba(255,255,255,0.3)" />
  <circle cx="78" cy="30" r="2" fill="rgba(255,255,255,0.3)" />

  <g filter="url(#shadow6)">
    <!-- AI Robot Head / Floating Orb -->
    <rect x="27" y="32" width="46" height="38" rx="19" fill="url(#aiFace)" />

    <!-- Visor / Screen -->
    <rect x="32" y="38" width="36" height="24" rx="12" fill="#0f172a" />

    <!-- Digital Friendly Eyes (Cyan Glow) -->
    <circle cx="43" cy="50" r="4" fill="#38bdf8" />
    <circle cx="44" cy="49" r="1.5" fill="#ffffff" />

    <circle cx="57" cy="50" r="4" fill="#38bdf8" />
    <circle cx="58" cy="49" r="1.5" fill="#ffffff" />

    <!-- Antenna / AI Transmitter -->
    <line x1="50" y1="32" x2="50" y2="23" stroke="#f3e8ff" stroke-width="2.5" stroke-linecap="round" />
    <circle cx="50" cy="21" r="3.5" fill="#facc15" stroke="#ffffff" stroke-width="1" />

    <!-- Floating Sparkles (AI Magic) -->
    <!-- Large Sparkle Top Right -->
    <polygon points="76,21 78,25 82,27 78,29 76,33 74,29 70,27 74,25" fill="#38bdf8" />

    <!-- Small Sparkle Bottom Left -->
    <polygon points="22,62 23.5,65 26.5,66.5 23.5,68 22,71 20.5,68 17.5,66.5 20.5,65" fill="#facc15" />
  </g>
</svg>
